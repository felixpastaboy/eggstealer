[package]
name = "eggstealer"
version = "0.2.0"
edition = "2021"

[dependencies]
bevy = { version = "0.16", features = ["wav"] }
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSData"] }
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSImage", "NSResponder"] }

[profile.release]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
